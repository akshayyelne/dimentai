<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-deep-teal text-center">Create Account</h1>

<script type="module">
  import { initializeApp }                        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const BACKEND_URL = "https://dimentai-engine-340111136050.us-central1.run.app";

  const firebaseConfig = {
    apiKey:            "AIzaSyA4tadYg3GjIeueICglQRP9ddH4DU9dEvo",
    authDomain:        "dimentai1.firebaseapp.com",
    projectId:         "dimentai1",
    storageBucket:     "dimentai1.firebasestorage.app",
    messagingSenderId: "340111136050",
    appId:             "1:340111136050:web:6ef60b7f5314fa92ed332b"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const form       = document.querySelector("form");
  const submitBtn  = form.querySelector("button[type=submit]");

  function setLoading(on) {
    submitBtn.disabled = on;
    submitBtn.innerHTML = on
      ? `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path></svg>`
      : `<span>Register</span><span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>`;
  }

  function showBanner(message, isError) {
    document.getElementById("status-banner")?.remove();
    const banner = document.createElement("div");
    banner.id = "status-banner";
    banner.className = `w-full rounded-md px-4 py-3 text-sm font-label-md mb-4 ${
      isError ? "bg-error-container text-on-error-container" : "bg-secondary-container text-on-secondary-container"
    }`;
    banner.textContent = message;
    form.prepend(banner);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    setLoading(true);

    const email     = document.getElementById("email").value.trim();
    const password  = document.getElementById("password").value;
    const firstName = document.getElementById("firstName").value.trim();
    const lastName  = document.getElementById("lastName").value.trim();
    const dob       = document.getElementById("dob").value;
    const phone     = document.getElementById("phone").value.trim();
    const address   = document.getElementById("address").value.trim();

    try {
      // Step 1: Create Firebase Auth user — returns UID
      const credential = await createUserWithEmailAndPassword(auth, email, password);
      const uid = credential.user.uid;

      // Step 2: Create patient profile in Firestore via backend
      const res = await fetch(`${BACKEND_URL}/register-patient`, {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          auth_uid:   uid,
          first_name: firstName,
          last_name:  lastName,
          email,
          dob,
          phone,
          address
        })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Backend error ${res.status}`);
      }

      showBanner("Registration successful! Redirecting to login…", false);
      setTimeout(() => { window.location.href = "/login"; }, 1500);

    } catch (err) {
      const msg = err.code === "auth/email-already-in-use"
        ? "This email is already registered. Please log in."
        : err.code === "auth/weak-password"
        ? "Password must be at least 6 characters."
        : err.message || "Registration failed. Please try again.";
      showBanner(msg, true);
      setLoading(false);
    }
  });
</script>
